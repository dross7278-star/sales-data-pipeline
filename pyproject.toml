[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sales-data-pipeline"
version = "0.1.0"
description = "A small CSV-to-PostgreSQL sales data pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.1,<4",
    "psycopg[binary]>=3.2,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sales_pipeline = ["schema.sql", "templates/*.html", "static/*.css", "static/*.js"]
